version: '3.8'

services:
  db:
    image: postgres:16
    container_name: diary-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 6vT008KmEwOdBv3Q
      POSTGRES_DB: diary
    ports:
      - "5433:5432"
    volumes:
      - diary_app_postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: diary-backend
    restart: always
    ports:
      - "9090:8888"
    environment:
      - DATABASE_URL=postgresql://postgres:6vT008KmEwOdBv3Q@db:5432/diary?sslmode=disable
      - CLOUDINARY_URL=cloudinary://979128287331962:yHPWFvWuDSlI82F2mLR1WfbgyLw@dsk0kjgsl
      - PORT=8888
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:9090
        - NEXT_PUBLIC_STORED_URL=http://localhost:9090
    container_name: diary-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:9090
      - NEXT_PUBLIC_STORED_URL=http://localhost:9090
    depends_on:
      - backend

volumes:
  diary_app_postgres_data:
    external: true
    name: diary_app_db-data